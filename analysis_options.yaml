# Strict but practical analysis. Rules are only disabled with a written reason.
# CI runs `flutter analyze --fatal-infos`, so every diagnostic must be fixed.
include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 100
  trailing_commas: preserve

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Promote issues that are almost always real bugs.
    missing_required_param: error
    missing_return: error
    unawaited_futures: warning
    # TODOs are allowed but must reference the roadmap/issue (see AGENTS.md).
    todo: ignore
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/generated/**
    - android/**
    - ios/**

linter:
  rules:
    # Correctness
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - only_throw_errors
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements

    # Architecture & readability
    - always_declare_return_types
    - always_use_package_imports
    - avoid_catches_without_on_clauses
    - avoid_positional_boolean_parameters
    - avoid_redundant_argument_values
    - avoid_returning_this
    - avoid_void_async
    - cascade_invocations
    - directives_ordering
    - omit_obvious_local_variable_types
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - type_annotate_public_apis
    - unnecessary_breaks
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_enums
    - use_super_parameters

    # Flutter performance
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - sized_box_for_whitespace
    - use_colored_box
    - use_decorated_box
