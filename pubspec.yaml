name: school_erp
description: "Multi-tenant Education ERP for schools, colleges, coaching institutes and academies."
publish_to: 'none'

# Version: <major>.<minor>.<patch>+<build number>. The build number must increase for every store upload.
version: 0.1.0+1

environment:
  sdk: ^3.13.2
  # Team toolchain is pinned in docs/development/setup.md and CI (.github/workflows/ci.yml).
  flutter: ">=3.47.2 <4.0.0"

# Every dependency must be justified in docs/architecture/dependencies.md.
dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.1
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Roboto is bundled so text renders identically on every Android OEM skin and on iOS.
  # Devanagari (Hindi) glyphs fall back to the platform font (Noto Sans Devanagari on
  # Android, Kohinoor Devanagari on iOS). License: assets/fonts/roboto/LICENSE.txt
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
